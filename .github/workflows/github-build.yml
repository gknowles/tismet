# github-build.yml

name: build

on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master, dev ]
  workflow_dispatch: {}

jobs:
  build-win:
    strategy:
      matrix:
        platform: [x64]
        configuration: [Debug, Release]
        toolset: [v145]
        image: [windows-2025-vs2026]
        coverage: [false]
        include:
          - platform: x64
            configuration: Debug
            toolset: v145
            image: windows-2025-vs2026
            coverage: true
    runs-on: ${{matrix.image}}
    defaults:
      run:
        shell: cmd
        working-directory: ${{github.workspace}}
    env:
      tests: |
        "bin\tst all"

    steps:
    - name: Setup OpenCppCoverage
      if: matrix.coverage
      run: |
        choco install OpenCppCoverage -y
        echo "C:\Program Files\OpenCppCoverage" >> %GITHUB_PATH%

    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Build
      run: |
        md build
        cd build
        set gen=Visual Studio 16 2019
        if "${{matrix.toolset}}" == "v142" set gen=Visual Studio 18 2026
        if "${{matrix.toolset}}" == "v143" set gen=Visual Studio 18 2026
        if "${{matrix.toolset}}" == "v145" set gen=Visual Studio 18 2026
        cmake .. -G "%gen%" -A ${{matrix.platform}} -T ${{matrix.toolset}}
        cmake . -DCMAKE_BUILD_TYPE=${{matrix.configuration}}^
          -DCMAKE_INSTALL_PREFIX=publish -DINSTALL_LIBS:BOOL=ON
        cmake --build . --target install --config ${{matrix.configuration}}
        cd publish

    - name: Test
      if: ${{!matrix.coverage}}
      run: |
        for %%t in (${{env.tests}}) do (
            %%~t
            if errorlevel 1 goto :eof
        )

    - name: Test Coverage
      if: matrix.coverage
      run: |
        set prog="C:\Program Files\OpenCppCoverage\OpenCppCoverage.exe"
        set opts=--export_type binary:temp.cov^
            --modules ${{github.workspace}}^
            --sources ${{github.workspace}}^
            --excluded_sources vendor^
            --excluded_sources tests^
            --excluded_sources testlibs^
            --excluded_sources *.g.cpp^
            --excluded_sources *.g.h^
            --excluded_line_regex ".* LCOV_EXCL_LINE.*"
        for %%t in (${{env.tests}}) do (
            if exist merged.cov (
                %prog% %opts% --input_coverage merged.cov -- %%~t
            ) else (
                %prog% %opts% -- %%~t
            )
            if errorlevel 1 goto :eof
            copy temp.cov merged.cov
        )
        %prog% --input_coverage merged.cov --export_type cobertura:merged.xml

    - name: Report Coverage
      if: matrix.coverage
      uses: codecov/codecov-action@v7
      with:
        token: ${{secrets.CODECOV_TOKEN}}
        files: merged.xml
        fail_ci_if_error: true
